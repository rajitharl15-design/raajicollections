services:
  - type: web
    name: raaji-collections
    runtime: docker
    plan: free
    rootDir: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        value: https://raajicollections.com,https://www.raajicollections.com,https://rajitharl15-design.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: raaji-collections-db
          property: connectionString
      # Optional shared token for admin image uploads (must match the one entered
      # in Catalog Admin -> localStorage "pf_token"). Leave unset to allow open uploads.
      - key: UPLOAD_TOKEN
        value: ""
      # Persist uploads on a Render disk (ephemeral otherwise). On the free plan
      # there is NO disk, so keep UPLOAD_DIR empty (files go to images/products in
      # the repo). To make uploads survive redeploys, upgrade to a plan with a disk,
      # set UPLOAD_DIR=/data and mount the "uploads" disk.
      - key: UPLOAD_DIR
        value: ""
      # ---- Secure admin credentials (REQUIRED for true admin security) ----
      # /admin, /admin.html and /api/upload are only accessible after logging in
      # with these credentials. Set AUTH_SECRET to a long random string.
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        value: CHANGE_ME_STRONG_PASSWORD
      - key: AUTH_SECRET
        value: CHANGE_ME_LONG_RANDOM_SECRET
    disks:
      - name: uploads
        mountPath: /data
        sizeGB: 1

databases:
  - name: raaji-collections-db
    plan: free
    databaseName: raaji_collections
    user: raaji_app
