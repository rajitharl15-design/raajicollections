services:
  - type: web
    name: raaji-collections
    runtime: docker
    plan: starter
    rootDir: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        value: https://raajicollections.com,https://www.raajicollections.com,https://rajitharl15-design.github.io
      # If you give Peacock its own subdomain (e.g. peacock.raajicollections.com),
      # set it here so that host's root opens the Peacock store instead of the
      # Raaji landing page.
      - key: PEACOCK_HOST
        value: peacock.raajicollections.com
      - key: DATABASE_URL
        fromDatabase:
          name: raaji-collections-db
          property: connectionString
      # Persist uploads on a Render disk (Starter+ plans include one free).
      # The "uploads" disk is mounted at /data, so uploaded images survive redeploys.
      # NOTE: admin credentials are NOT set here — the Raaji + Peacock admins are
      # DB-backed (first-time setup at /admin) so no secrets live in this repo.
      - key: UPLOAD_DIR
        value: /data
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 1

  # Keep the web instance warm so visitors never hit a 30-60s cold start.
  # (Requires a paid plan; on free tier remove this and use an external
  # uptime monitor like UptimeRobot instead.)
  - type: cron
    name: raaji-keep-warm
    runtime: python
    plan: starter
    schedule: "*/10 * * * *"
    startCommand: python keepwarm.py
    envVars:
      - key: KEEP_WARM_URL
        value: https://raaji-collections.onrender.com/api/health

databases:
  - name: raaji-collections-db
    plan: 0.1c-256mb
    databaseName: raaji_collections
    user: raaji_app
