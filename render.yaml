services:
  - type: web
    name: raaji-collections
    runtime: docker
    plan: free
    rootDir: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        value: https://raajicollections.com,https://www.raajicollections.com,https://rajitharl15-design.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: raaji-collections-db
          property: connectionString
      # Optional shared token for admin image uploads (must match the one entered
      # in Catalog Admin -> localStorage "pf_token"). Leave unset to allow open uploads.
      - key: UPLOAD_TOKEN
        value: ""
      # Persist uploads on a Render disk (ephemeral otherwise). Mounted at /data
      # and served at /uploads. Without this, uploads go to images/products in the
      # repo (also served, but lost on redeploy). Alternative: object store (S3/Cloudinary).
      - key: UPLOAD_DIR
        value: /data
    disks:
      - name: uploads
        mountPath: /data
        sizeGB: 1

databases:
  - name: raaji-collections-db
    plan: free
    databaseName: raaji_collections
    user: raaji_app
