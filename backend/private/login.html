<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Raaji Collections</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { --primary:#8B1A2B; --primary-dark:#5C101B; --cream:#FFF8F0; --beige:#F5E6D3; --dark:#2C1810; --text:#3C2415; --text-light:#6B5A3E; --white:#FFFFFF; --shadow:0 4px 20px rgba(44,24,16,.10); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Poppins',sans-serif; background:var(--cream); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .box { background:var(--white); border-radius:12px; box-shadow:var(--shadow); padding:36px; max-width:400px; width:100%; text-align:center; }
    .badge { width:60px; height:60px; border-radius:50%; margin:0 auto 14px; background:var(--primary); display:grid; place-items:center; color:#fff; font-size:24px; }
    h1 { font-family:'Playfair Display',serif; font-size:24px; color:var(--dark); margin:0 0 4px; }
    p { color:var(--text-light); font-size:13px; margin:0 0 18px; }
    input { width:100%; padding:12px 15px; border:1px solid var(--beige); border-radius:6px; font-size:14px; margin-bottom:12px; outline:none; font-family:'Poppins',sans-serif; background:var(--cream); }
    input:focus { border-color:var(--primary); }
    button { width:100%; border:none; cursor:pointer; padding:12px; border-radius:6px; background:var(--primary); color:#fff; font-family:'Poppins',sans-serif; font-size:14px; font-weight:500; }
    button:hover { background:var(--primary-dark); }
    .err { color:#D32F2F; font-size:13px; margin-top:10px; min-height:18px; }
    .hint { font-size:12px; color:var(--text-light); margin-top:14px; line-height:1.6; }
    .divider { border-top:1px solid var(--beige); margin:20px 0 14px; }
    .toggle { display:block; margin-top:14px; font-size:13px; color:var(--primary); background:none; border:none; cursor:pointer; }
    .hide { display:none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="badge"><i class="fas fa-feather"></i></div>
    <h1 id="title">Admin Login</h1>
    <p>Raaji Collections · Secure Catalog Admin</p>

    <!-- First-time setup -->
    <form id="setupForm" class="hide">
      <input type="text" id="suUser" placeholder="Choose username" autocomplete="username">
      <input type="password" id="suPass" placeholder="Choose password (6+ chars)" autocomplete="new-password">
      <button type="submit">Create admin &amp; sign in</button>
      <p class="err" id="suErr"></p>
      <p class="hint">This is the FIRST login. Your credentials are stored securely on the server (in your database). Save them — you'll need them to sign in later.</p>
    </form>

    <!-- Login -->
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" autocomplete="username">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      <button type="submit">Sign in</button>
      <p class="err" id="err"></p>
    </form>
  </div>
  <script>
    (function () {
      var setupForm = document.getElementById('setupForm');
      var loginForm = document.getElementById('loginForm');
      var suErr = document.getElementById('suErr');
      var err = document.getElementById('err');

      function showSetup() { setupForm.classList.remove('hide'); loginForm.classList.add('hide'); document.getElementById('title').textContent = 'Set up admin'; }
      function showLogin() { loginForm.classList.remove('hide'); setupForm.classList.add('hide'); document.getElementById('title').textContent = 'Admin Login'; }

      fetch('/api/admin/status', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) { if (d.configured === false) showSetup(); })
        .catch(function () { });

      setupForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        suErr.textContent = 'Creating…';
        try {
          var res = await fetch('/api/admin/setup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('suUser').value.trim(), password: document.getElementById('suPass').value }) });
          var d = await res.json();
          if (res.ok && d.ok) { suErr.style.color = '#2e7d32'; suErr.textContent = 'Admin created — redirecting…'; location.href = '/admin'; }
          else { suErr.style.color = '#D32F2F'; suErr.textContent = d.error || 'Setup failed.'; }
        } catch (e2) { suErr.textContent = 'Server unavailable.'; }
      });

      loginForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        err.textContent = 'Signing in…';
        try {
          var res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value }) });
          var d = await res.json();
          if (res.ok && d.ok) { location.href = '/admin'; }
          else { err.textContent = d.error || 'Incorrect username or password.'; }
        } catch (e2) { err.textContent = 'Server unavailable.'; }
      });
    })();
  </script>
</body>
</html>
