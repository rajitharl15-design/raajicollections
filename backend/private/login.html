<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Raaji Collections</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { --primary:#8B1A2B; --primary-dark:#5C101B; --cream:#FFF8F0; --beige:#F5E6D3; --dark:#2C1810; --text:#3C2415; --text-light:#6B5A3E; --white:#FFFFFF; --shadow:0 4px 20px rgba(44,24,16,.10); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Poppins',sans-serif; background:var(--cream); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .box { background:var(--white); border-radius:12px; box-shadow:var(--shadow); padding:40px; max-width:380px; width:100%; text-align:center; }
    .badge { width:60px; height:60px; border-radius:50%; margin:0 auto 16px; background:var(--primary); display:grid; place-items:center; color:#fff; font-size:24px; }
    h1 { font-family:'Playfair Display',serif; font-size:24px; color:var(--dark); margin:0 0 4px; }
    p { color:var(--text-light); font-size:13px; margin:0 0 20px; }
    input { width:100%; padding:13px 16px; border:1px solid var(--beige); border-radius:6px; font-size:14px; margin-bottom:14px; outline:none; font-family:'Poppins',sans-serif; background:var(--cream); }
    input:focus { border-color:var(--primary); }
    button { width:100%; border:none; cursor:pointer; padding:12px; border-radius:6px; background:var(--primary); color:#fff; font-family:'Poppins',sans-serif; font-size:14px; font-weight:500; }
    button:hover { background:var(--primary-dark); }
    .err { color:#D32F2F; font-size:13px; margin-top:10px; min-height:18px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="badge"><i class="fas fa-feather"></i></div>
    <h1>Admin Login</h1>
    <p>Raaji Collections · Secure Catalog Admin</p>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" autocomplete="username">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      <button type="submit">Sign in</button>
      <p class="err" id="err"></p>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var err = document.getElementById('err');
      err.textContent = 'Signing in…';
      try {
        var res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
        });
        var data = await res.json();
        if (res.ok && data.ok) { location.href = '/admin'; }
        else { err.textContent = (data.error || 'Incorrect username or password.'); }
      } catch (e2) { err.textContent = 'Server unavailable.'; }
    });
  </script>
</body>
</html>
