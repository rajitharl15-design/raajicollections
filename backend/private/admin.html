<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raaji Collections — Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="admin-page">

  <!-- Header -->
  <header class="admin-header">
    <div class="admin-header-inner">
      <h1>Raaji Collections <span>Admin</span></h1>
      <div class="admin-actions">
        <a class="admin-link" href="index.html">View site</a>
        <a class="admin-link" href="store.html">Peacock store</a>
        <button class="btn btn-outline" id="adminExportBtn"><i class="fas fa-download"></i> Export CSV</button>
        <button class="btn btn-outline btn-danger" id="adminClearBtn"><i class="fas fa-trash"></i> Clear Orders</button>
        <button class="btn btn-outline btn-danger" id="adminLogoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
  </header>

  <main class="admin-main">

    <!-- Login -->
    <section id="adminLogin" class="hidden admin-login">
      <div class="admin-login-box">
        <h2>Admin Login</h2>
        <p>Enter your admin key to continue</p>
        <input type="password" id="adminKeyInput" placeholder="Admin key" autocomplete="off">
        <button class="btn btn-primary" id="adminLoginBtn">Sign in</button>
        <p class="admin-err" id="adminLoginErr"></p>
        <p class="admin-back"><a href="index.html">&larr; Back to store</a></p>
      </div>
    </section>

    <!-- Dashboard -->
    <section id="adminDashboard" class="hidden">

      <!-- Tabs -->
      <div class="admin-tabs">
        <button class="tab-btn active" data-tab="orders">Orders</button>
        <button class="tab-btn" data-tab="addproduct">Add Product</button>
        <button class="tab-btn" data-tab="manageproducts">Manage Products</button>
      </div>

      <!-- ORDERS -->
      <div id="tab-orders">
        <div class="admin-stats" id="adminStats"></div>
        <div class="admin-filters">
          <button class="filter-btn active" data-status="all">All</button>
          <button class="filter-btn" data-status="pending">Pending</button>
          <button class="filter-btn" data-status="confirmed">Confirmed</button>
          <button class="filter-btn" data-status="packed">Packed</button>
          <button class="filter-btn" data-status="shipped">Shipped</button>
          <button class="filter-btn" data-status="delivered">Delivered</button>
          <button class="filter-btn" data-status="paid">Paid</button>
          <button class="filter-btn" data-status="failed">Failed</button>
        </div>
        <div class="admin-orders" id="adminOrders"><p class="admin-loading">Loading orders...</p></div>
      </div>

      <!-- ADD PRODUCT -->
      <div id="tab-addproduct" class="hidden">
        <div class="product-form">
          <h3>Add New Product</h3>
          <label>Name <input id="pfName" type="text" placeholder="Product name"></label>
          <label>Category
            <select id="pfCategory"><option value="">Loading categories...</option></select>
          </label>
          <div id="pfSubcatWrap" class="hidden">
            <label>Subcategory
              <select id="pfSubcategory"><option value="">None</option></select>
            </label>
          </div>
          <label>Price (₹) <input id="pfPrice" type="number" min="0" placeholder="0"></label>
          <label>Old Price (₹) <input id="pfOldPrice" type="number" min="0" placeholder="optional"></label>
          <label>Stock <input id="pfStock" type="number" min="0" value="0"></label>
          <label>Badge <input id="pfBadge" type="text" placeholder="New / Sale"></label>
          <label>Description <textarea id="pfDesc" rows="3" placeholder="Optional description"></textarea></label>

          <div class="file-drop">
            <button type="button" class="btn btn-outline" id="pfDropBtn"><i class="fas fa-image"></i> <span id="pfDropLabel">+ Add product images (multiple)</span></button>
            <input type="file" id="pfImages" accept="image/*" multiple hidden>
          </div>
          <div class="pf-preview" id="pfPreview"></div>

          <button class="btn btn-primary pf-submit" id="pfSaveBtn"><i class="fas fa-save"></i> Save Product</button>
          <p class="pf-status" id="pfStatus"></p>
        </div>
      </div>

      <!-- MANAGE PRODUCTS -->
      <div id="tab-manageproducts" class="hidden">
        <div class="product-manage">
          <div class="admin-actions" style="color:#5C101B">
            <label>Category
              <select id="pmCategoryFilter"><option value="">All</option></select>
            </label>
            <button class="btn btn-outline" id="pmRefreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
          </div>
          <div id="pmList"><p class="admin-loading">Loading products...</p></div>
        </div>
      </div>

    </section>
  </main>

  <!-- Variant (sizes & colors) modal -->
  <div id="variantModal" class="admin-modal hidden">
    <div class="admin-modal-box">
      <button class="admin-modal-close" data-vm-close><i class="fas fa-times"></i></button>
      <h2>Sizes &amp; Colors</h2>
      <p class="admin-order-meta" id="vmProductName"></p>
      <div id="vmRows"></div>
      <button class="btn btn-outline" id="vmAddRow"><i class="fas fa-plus"></i> Add Size</button>
      <button class="btn btn-primary" id="vmSave"><i class="fas fa-save"></i> Save Sizes</button>
      <p class="pf-status" id="vmStatus"></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
  <script>
    // This admin is served only after server login, so skip the client key gate
    // and open the dashboard directly.
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof showDashboard === 'function') showDashboard();
    });
  </script>
</body>
</html>
