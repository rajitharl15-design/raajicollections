<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Admin - Raaji Collections</title>
  <meta name="description" content="Raaji Collections admin dashboard - manage orders, products & payments.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8B1A2B">
  <link rel="stylesheet" href="css/style.css?v=9">
  <link rel="stylesheet" href="css/admin.css?v=2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></noscript>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="admin-page">

  <div class="admin-login" id="adminLogin">
    <div class="admin-login-box">
      <h2>Admin Login</h2>
      <p>Enter your admin key to manage orders</p>
      <input type="password" id="adminKeyInput" placeholder="Admin key" autocomplete="off">
      <button class="btn-primary" id="adminLoginBtn">Login</button>
      <p class="admin-err" id="adminLoginErr"></p>
      <p class="admin-back"><a href="index.html">&larr; Back to store</a></p>
    </div>
  </div>

  <div class="admin-dashboard hidden" id="adminDashboard">
    <header class="admin-header">
      <div class="admin-header-inner">
        <h1>Raaji Collections <span>Admin</span></h1>
        <div class="admin-actions">
          <a href="index.html" class="admin-link"><i class="fas fa-store"></i> View Store</a>
          <button id="adminExportBtn" class="btn-outline"><i class="fas fa-download"></i> Export CSV</button>
          <button id="adminLogoutBtn" class="btn-outline">Logout</button>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-tabs">
        <button class="tab-btn active" data-tab="orders">Orders</button>
        <button class="tab-btn" data-tab="addproduct">Add Product</button>
        <button class="tab-btn" data-tab="manageproducts">Manage Products</button>
      </div>

      <section id="tab-orders">
        <div class="admin-stats" id="adminStats"></div>

        <div class="admin-filters">
          <button class="filter-btn active" data-status="all">All</button>
          <button class="filter-btn" data-status="pending">Pending</button>
          <button class="filter-btn" data-status="confirmed">Confirmed</button>
          <button class="filter-btn" data-status="paid">Paid</button>
          <button class="filter-btn" data-status="shipped">Shipped</button>
          <button class="filter-btn" data-status="delivered">Delivered</button>
        </div>

        <div class="admin-orders" id="adminOrders">
          <p class="admin-loading">Loading orders...</p>
        </div>
      </section>

      <section id="tab-addproduct" class="hidden">
        <div class="product-form">
          <h3>Add New Product</h3>
          <div class="pf-grid">
            <label>Product Name
              <input type="text" id="pfName" placeholder="e.g. Red Banarasi Saree">
            </label>
            <label>Category
              <select id="pfCategory"></select>
            </label>
            <label>Price (₹)
              <input type="number" id="pfPrice" min="0" placeholder="2499">
            </label>
            <label>Old Price (₹, optional)
              <input type="number" id="pfOldPrice" min="0" placeholder="2999">
            </label>
            <label>Stock
              <input type="number" id="pfStock" min="0" value="10">
            </label>
            <label>Badge (optional)
              <input type="text" id="pfBadge" placeholder="New / Sale">
            </label>
          </div>
          <label>Description
            <textarea id="pfDesc" rows="2" placeholder="Short description..."></textarea>
          </label>
          <div class="pf-images">
            <label class="file-drop">
              <input type="file" id="pfImages" accept="image/*" multiple>
              <span>+ Click to add product images (multiple)</span>
            </label>
            <div id="pfPreview" class="pf-preview"></div>
          </div>
          <div class="pf-submit">
            <button id="pfSaveBtn" class="btn-primary">Save Product</button>
            <span id="pfStatus" class="pf-status"></span>
          </div>
        </div>
      </section>
    <section id="tab-manageproducts" class="hidden">
        <div class="product-manage">
          <h3>Manage Products</h3>
          <div class="pm-filters">
            <label>Category:
              <select id="pmCategoryFilter">
                <option value="">All</option>
              </select>
            </label>
            <button id="pmRefreshBtn" class="btn-outline"><i class="fas fa-sync-alt"></i> Refresh</button>
          </div>
          <div class="admin-orders" id="pmList">
            <p class="admin-loading">Loading products...</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/config.js?v=3"></script>
  <script src="js/admin.js?v=4"></script>
</body>
</html>
